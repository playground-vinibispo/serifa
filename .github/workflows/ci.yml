name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  conferir:
    name: análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project ruff check .

  testes:
    name: suíte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyGObject e as bibliotecas GObject vêm do sistema, não do pip.
      # Instalar por pip criaria uma segunda cópia que não enxerga o
      # GtkSourceView nem o Poppler instalados.
      - name: bibliotecas do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-gtksource-5 gir1.2-adw-1 gir1.2-poppler-0.18 \
            xvfb

      - uses: astral-sh/setup-uv@v5

      - name: ambiente
        run: |
          uv venv --python "$(command -v python3)" --system-site-packages .venv
          uv pip install --python .venv/bin/python --group dev

      # O GTK4 não tem backend offscreen; o Xvfb dá o servidor gráfico de que
      # os testes de janela precisam. Os que dependem do latexmk se pulam
      # sozinhos, para a CI não baixar um texlive inteiro.
      - name: suíte
        run: xvfb-run -a ./bin/testes --cobertura
